<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Fortsun — Teste de Auth</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}
.ok{color:green;font-weight:bold}
.err{color:red;font-weight:bold}
.warn{color:orange;font-weight:bold}
.box{background:#f5f5f5;border-radius:8px;padding:16px;margin:12px 0;font-size:13px}
button{padding:10px 20px;background:#0D2B4E;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin:8px 0}
pre{background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:6px;overflow-x:auto;font-size:12px}
</style>
</head>
<body>

<h2>🔍 Fortsun — Diagnóstico de Autenticação</h2>

<div class="box" id="step1">⏳ Verificando configuração...</div>
<div class="box" id="step2" style="display:none"></div>
<div class="box" id="step3" style="display:none"></div>
<div class="box" id="btnArea" style="display:none">
  <div id="gSignInBtn"></div>
  <div id="tokenBtn" style="margin-top:12px"></div>
</div>
<div class="box" id="result" style="display:none"></div>

<script src="config.js"></script>
<script>

function log(id, html){ document.getElementById(id).innerHTML = html; document.getElementById(id).style.display='block'; }

// STEP 1 — checa config
window.addEventListener('load', () => {
  const cid = CONFIG.GOOGLE_CLIENT_ID;
  const sid = CONFIG.SPREADSHEET_ID;

  let s1 = '<strong>Step 1 — config.js</strong><br>';

  if (!cid || cid.includes('SEU_CLIENT_ID') || cid.includes('COLE_O')) {
    s1 += '<span class="err">❌ GOOGLE_CLIENT_ID não configurado!</span>';
  } else {
    s1 += `<span class="ok">✅ Client ID: ${cid}</span>`;
  }
  s1 += '<br>';
  if (!sid || sid.length < 10) {
    s1 += '<span class="err">❌ SPREADSHEET_ID não configurado!</span>';
  } else {
    s1 += `<span class="ok">✅ Spreadsheet ID: ${sid}</span>`;
  }
  s1 += '<br>';
  s1 += `<span class="ok">✅ ${CONFIG.ALLOWED_USERS.length} usuários cadastrados</span><br>`;
  s1 += `<b>Emails permitidos:</b><br>`;
  CONFIG.ALLOWED_USERS.forEach(u => { s1 += `• ${u.email} (${u.role})<br>`; });

  log('step1', s1);
});

</script>

<!-- GAPI -->
<script src="https://apis.google.com/js/api.js" async defer onload="onGapiLoad()"></script>
<!-- GIS -->
<script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>

<script>
let gapiOk = false, gisOk = false;

function onGapiLoad(){
  log('step2', '⏳ Carregando GAPI client...');
  gapi.load('client', async () => {
    try {
      await gapi.client.init({
        discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4']
      });
      gapiOk = true;
      log('step2', '<span class="ok">✅ GAPI client carregado com sucesso</span>');
      tryInit();
    } catch(e) {
      log('step2', `<span class="err">❌ Erro GAPI: ${e.message || JSON.stringify(e)}</span>`);
    }
  });
}

function onGisLoad(){
  gisOk = true;
  log('step3', '<span class="ok">✅ Google Identity Services carregado</span>');
  tryInit();
}

function tryInit(){
  if (!gapiOk || !gisOk) return;

  const cid = CONFIG.GOOGLE_CLIENT_ID;

  // Inicializa Sign-In button
  try {
    google.accounts.id.initialize({
      client_id: cid,
      callback: onSignIn,
      auto_select: false,
    });
    google.accounts.id.renderButton(
      document.getElementById('gSignInBtn'),
      { theme:'outline', size:'large', text:'signin_with', width:300 }
    );
    log('step3', '<span class="ok">✅ GIS inicializado — botão renderizado abaixo</span>');
  } catch(e) {
    log('step3', `<span class="err">❌ Erro ao inicializar GIS: ${e.message}</span>`);
  }

  // Token client
  window.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: onToken,
    error_callback: err => {
      log('result', `<span class="err">❌ Erro token: ${JSON.stringify(err)}</span>`);
    }
  });

  document.getElementById('btnArea').style.display = 'block';
  document.getElementById('tokenBtn').innerHTML =
    '<button onclick="testToken()">🔑 Testar acesso ao Sheets (Token)</button>';
}

function onSignIn(resp){
  try {
    const parts = resp.credential.split('.');
    const pay   = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
    const email = pay.email.toLowerCase();
    const found = CONFIG.ALLOWED_USERS.find(u => u.email.toLowerCase() === email);
    let html = `<strong>✅ Login Google OK!</strong><br>`;
    html += `Email: <b>${pay.email}</b><br>`;
    html += `Nome: ${pay.name}<br>`;
    html += found
      ? `<span class="ok">✅ Usuário autorizado: ${found.nome} (${found.role})</span>`
      : `<span class="err">❌ Email NÃO está na lista ALLOWED_USERS do config.js</span>`;
    log('result', html);
  } catch(e) {
    log('result', `<span class="err">❌ Erro ao processar login: ${e.message}</span>`);
  }
}

function testToken(){
  log('result', '⏳ Solicitando token Sheets...');
  window.tokenClient.requestAccessToken({ prompt: 'consent' });
}

function onToken(resp){
  if (resp.error) {
    log('result', `<span class="err">❌ Erro token Sheets: ${resp.error} — ${resp.error_description || ''}</span>`);
    return;
  }
  log('result', `<span class="ok">✅ Token Sheets obtido com sucesso!<br>Scope: ${resp.scope}<br>Expira em: ${resp.expires_in}s</span>`);
  testSheets();
}

async function testSheets(){
  try {
    const res = await gapi.client.sheets.spreadsheets.get({ spreadsheetId: CONFIG.SPREADSHEET_ID });
    const sheets = res.result.sheets.map(s => s.properties.title);
    log('result', document.getElementById('result').innerHTML +
      `<br><span class="ok">✅ Planilha acessada: "${res.result.properties.title}"<br>Abas: ${sheets.join(', ')}</span>`);
  } catch(e) {
    log('result', document.getElementById('result').innerHTML +
      `<br><span class="err">❌ Erro ao acessar planilha: ${e.result?.error?.message || e.message}</span>`);
  }
}
</script>
</body>
</html>
