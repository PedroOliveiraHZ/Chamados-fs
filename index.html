<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fortsun — Sistema de Chamados</title>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>

<!-- ── TOPBAR ────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <div class="logo-circle-sm"><img src="logo.png" alt="Fortsun" class="logo-img"/></div>
      <span class="topbar-brand">Fortsun</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-sm" id="btnNav" onclick="toggleView()">
      <i class="ti ti-lock" aria-hidden="true"></i> <span id="btnNavLabel">Painel</span>
    </button>
  </div>
</header>

<div class="main-layout">
  <main class="content" id="content" style="width:100%;max-width:760px;margin:0 auto;">

    <!-- ── VIEW: ABRIR CHAMADO (pública, padrão) ─────────────────── -->
    <section id="viewNovo">
      <div class="ph"><div class="ph-title">Abrir chamado</div></div>

      <div class="fg">
        <label class="fl">Seu nome</label>
        <input id="nQuem" type="text" placeholder="Digite seu nome completo" required/>
      </div>

      <div class="fg">
        <label class="fl">Seu e-mail</label>
        <input id="nEmail" type="email" placeholder="seunome@fortsunbrasil.com" required/>
      </div>

      <div class="fg">
        <label class="fl">Setor</label>
        <select id="nSetor"></select>
      </div>

      <div class="fg">
        <label class="fl">Título</label>
        <input id="nTit" type="text" placeholder="Descreva brevemente a solicitação"/>
      </div>

      <div class="fg">
        <label class="fl">Descrição detalhada</label>
        <textarea id="nDesc" placeholder="Explique o que precisa e por quê..."></textarea>
      </div>

      <div class="fg">
        <label class="fl">Prioridade</label>
        <select id="nPrio"></select>
      </div>

      <div class="fg">
        <label class="fl">Anexos (opcional)</label>
        <label class="anexo-dropzone" for="nAnexos">
          <i class="ti ti-upload" aria-hidden="true"></i>
          <span id="nAnexosLabel">Clique ou arraste arquivos aqui</span>
        </label>
        <input id="nAnexos" type="file" multiple style="display:none" onchange="updateAnexosLabel(this)"/>
      </div>

      <button class="btn btn-primary" id="submitBtn" onclick="submitTicket()" style="width:100%;justify-content:center;padding:12px;">
        <i class="ti ti-send" aria-hidden="true"></i> Enviar chamado
      </button>
      <div id="novoMsg" style="margin-top:12px"></div>
    </section>

    <!-- ── VIEW: LOGIN DO PAINEL ─────────────────────────────────── -->
    <section id="viewLogin" style="display:none;max-width:380px;margin:60px auto 0;">
      <div class="login-box">
        <div class="login-logo"><div class="logo-circle"><img src="logo.png" alt="Fortsun" class="logo-img"/></div></div>
        <div class="login-title">Painel de chamados</div>
        <div class="login-sub">Acesso restrito — Henrique / Rafael</div>
        <div class="fg" style="text-align:left;margin-top:20px">
          <label class="fl">Senha de acesso</label>
          <input id="pSenha" type="password" placeholder="Senha do painel" onkeydown="if(event.key==='Enter')doLoginPainel()"/>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" onclick="doLoginPainel()">
          <i class="ti ti-login" aria-hidden="true"></i> Entrar
        </button>
        <div id="loginError" class="login-error" style="display:none;margin-top:14px">
          <i class="ti ti-alert-circle" aria-hidden="true"></i>
          <span id="loginErrorMsg">Senha incorreta</span>
        </div>
      </div>
    </section>

    <!-- ── VIEW: PAINEL (gerenciamento) ──────────────────────────── -->
    <section id="viewPainel" style="display:none;max-width:100%;">
      <div class="ph">
        <div class="ph-title">Painel de chamados</div>
        <button class="btn btn-sm" onclick="reloadPainel()"><i class="ti ti-refresh"></i> Atualizar</button>
      </div>

      <div class="mcrow" id="mcrow"></div>

      <div class="filter-bar">
        <select id="fStatus" onchange="renderPainel()">
          <option value="">Todos os status</option>
        </select>
        <select id="fSetor" onchange="renderPainel()">
          <option value="">Todos os setores</option>
        </select>
        <input id="fBusca" type="text" placeholder="Buscar por título..." oninput="renderPainel()"/>
      </div>

      <div class="tlist" id="tlist"></div>
    </section>

  </main>
</div>

<!-- ── MODAL: DETALHE DO CHAMADO ─────────────────────────────────── -->
<div class="overlay" id="ovTicket">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="mTitle">Chamado</h3>
      <button class="btn btn-icon" onclick="closeMod()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer" id="mFoot"></div>
  </div>
</div>

<div class="sync-bar" id="syncBar" style="display:none"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
